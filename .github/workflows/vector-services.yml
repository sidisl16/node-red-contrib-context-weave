name: Vector databases
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
      qdrant:
        image: qdrant/qdrant:v1.15.5
        ports: ['6333:6333']
      chroma:
        image: chromadb/chroma:1.0.20
        ports: ['8000:8000']
    env:
      PGPASSWORD: test-only
      CW_TEST_VECTOR_SERVICES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
      - run: npm ci --ignore-scripts
      - run: |
          curl --fail --retry 15 --retry-connrefused http://localhost:6333/readyz
          curl --fail --retry 15 --retry-connrefused http://localhost:8000/api/v2/heartbeat
          psql -h 127.0.0.1 -U postgres -c 'CREATE EXTENSION IF NOT EXISTS vector'
          node --test test/vector-services.test.js
