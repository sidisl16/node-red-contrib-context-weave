<script type="text/javascript">
RED.nodes.registerType("context-weave-file-ingest", {
  "category": "context weave",
  "defaults": {
    "name": {
      "value": ""
    },
    "library": {
      "value": "",
      "type": "context-weave-library",
      "required": false
    },
    "parserRoute": {
      "value": "auto"
    },
    "extractor": {
      "value": "",
      "type": "context-weave-provider",
      "required": false
    },
    "maxFileMb": {
      "value": 10
    },
    "timeoutSeconds": {
      "value": 60
    },
    "fileSource": {
      "value": "payload"
    },
    "fileSourceType": {
      "value": "msg"
    },
    "documentIdSource": {
      "value": ""
    },
    "documentIdSourceType": {
      "value": "msg"
    },
    "metadataSource": {
      "value": ""
    },
    "metadataSourceType": {
      "value": "msg"
    },
    "filenameSource": {
      "value": ""
    },
    "filenameSourceType": {
      "value": "msg"
    },
    "mimeTypeSource": {
      "value": ""
    },
    "mimeTypeSourceType": {
      "value": "msg"
    }
  },
  "color": "#F4A261",
  "inputs": 1,
  "outputs": 2,
  "outputLabels": [
    "success",
    "error"
  ],
  "icon": "font-awesome/fa-file-o",
  paletteLabel: function () { return "file-ingest"; },
  label: function () { return this.name || "file-ingest"; },
  oneditprepare: function () {
    const visibilityRules = {"extractor":{"field":"parserRoute","in":["auto","remote"]},"timeoutSeconds":{"field":"parserRoute","in":["auto","remote"]}};
    const fieldValue = field => { const input = $('#node-input-' + field); return input.attr('type') === 'checkbox' ? input.prop('checked') : input.val(); };
    const updateVisibility = () => {
      Object.entries(visibilityRules).forEach(([field, rule]) => {
        const value = fieldValue(rule.field);
        const visible = rule.truthy ? value === true : rule.in ? rule.in.includes(value) : !rule.not.includes(value);
        $('#node-input-' + field).closest('.form-row').toggle(visible);
      });
    };
    $('#node-input-parserRoute').on('change.contextWeaveVisibility', updateVisibility);
    updateVisibility();
  },
  oneditsave: function () {
    this.maxFileMb = Number($('#node-input-maxFileMb').val()); $('#node-input-maxFileMb').remove();
    this.timeoutSeconds = Number($('#node-input-timeoutSeconds').val()); $('#node-input-timeoutSeconds').remove();
  }
});
</script>

  <div class="form-row" data-field="mimeTypeSource"><label for="node-input-mimeTypeSource" title="Message path or typed value read at runtime.">mime type source</label><input id="node-input-mimeTypeSource" type="text"></div>
