<script type="text/javascript">
RED.nodes.registerType("context-weave-rerank", {
  "category": "context weave",
  "defaults": {
    "name": {
      "value": ""
    },
    "querySource": {
      "value": "contextWeave.query"
    },
    "querySourceType": {
      "value": "msg"
    },
    "evidenceSource": {
      "value": "contextWeave.evidence"
    },
    "evidenceSourceType": {
      "value": "msg"
    },
    "strategy": {
      "value": "mmr"
    },
    "stages": {
      "value": []
    },
    "rerankProfile": {
      "value": "",
      "type": "context-weave-model-profile",
      "required": false
    },
    "diversityBias": {
      "value": 0.3
    },
    "limit": {
      "value": 10
    },
    "cutoff": {
      "value": ""
    },
    "field": {
      "value": ""
    },
    "boost": {
      "value": 1
    }
  },
  "color": "#5B8DEF",
  "inputs": 1,
  "outputs": 2,
  "outputLabels": [
    "success",
    "error"
  ],
  "icon": "font-awesome/fa-sort-amount-desc",
  paletteLabel: function () { return "rerank"; },
  label: function () { return this.name || "rerank"; },
  oneditprepare: function () {
    $('#node-input-stages').val(JSON.stringify(this.stages ?? [], null, 2));
    const visibilityRules = {"stages":{"field":"strategy","in":["chain"]},"rerankProfile":{"field":"strategy","in":["cross-encoder"]},"diversityBias":{"field":"strategy","in":["mmr"]},"field":{"field":"strategy","in":["rule"]},"boost":{"field":"strategy","in":["rule"]}};
    const fieldValue = field => { const input = $('#node-input-' + field); return input.attr('type') === 'checkbox' ? input.prop('checked') : input.val(); };
    const updateVisibility = () => {
      Object.entries(visibilityRules).forEach(([field, rule]) => {
        const value = fieldValue(rule.field);
        const visible = rule.truthy ? value === true : rule.in ? rule.in.includes(value) : !rule.not.includes(value);
        $('#node-input-' + field).closest('.form-row').toggle(visible);
      });
    };
    $('#node-input-strategy').on('change.contextWeaveVisibility', updateVisibility);
    updateVisibility();
  },
  oneditsave: function () {
    this.stages = JSON.parse($('#node-input-stages').val()); $('#node-input-stages').remove();
    this.diversityBias = Number($('#node-input-diversityBias').val()); $('#node-input-diversityBias').remove();
    this.limit = Number($('#node-input-limit').val()); $('#node-input-limit').remove();
    this.boost = Number($('#node-input-boost').val()); $('#node-input-boost').remove();
  }
});
</script>

<script type="text/html" data-template-name="context-weave-rerank">
  <div class="form-row" data-field="name"><label for="node-input-name" title="Optional label shown on the flow.">name</label><input id="node-input-name" type="text"></div>
  <div class="form-row" data-field="querySource"><label for="node-input-querySource" title="Message path or typed value read at runtime.">query source</label><input id="node-input-querySource" type="text"></div>
  <div class="form-row" data-field="querySourceType"><label for="node-input-querySourceType" title="Node-RED typed-input kind used to evaluate the adjacent source value.">query source type</label><select id="node-input-querySourceType"><option value="msg">msg</option><option value="str">str</option><option value="flow">flow</option><option value="global">global</option><option value="env">env</option><option value="bool">bool</option><option value="num">num</option><option value="json">json</option></select></div>
  <div class="form-row" data-field="evidenceSource"><label for="node-input-evidenceSource" title="Message path or typed value read at runtime.">evidence source</label><input id="node-input-evidenceSource" type="text"></div>
  <div class="form-row" data-field="evidenceSourceType"><label for="node-input-evidenceSourceType" title="Node-RED typed-input kind used to evaluate the adjacent source value.">evidence source type</label><select id="node-input-evidenceSourceType"><option value="msg">msg</option><option value="str">str</option><option value="flow">flow</option><option value="global">global</option><option value="env">env</option><option value="bool">bool</option><option value="num">num</option><option value="json">json</option></select></div>
  <div class="form-row" data-field="strategy"><label for="node-input-strategy" title="Algorithm used by this node.">strategy</label><select id="node-input-strategy"><option value="none">none</option><option value="cross-encoder">cross-encoder</option><option value="mmr">mmr</option><option value="rule">rule</option><option value="chain">chain</option></select></div>
  <div class="form-row" data-field="stages"><label for="node-input-stages" title="Ordered JSON reranking stages used by chain mode.">stages</label><textarea id="node-input-stages" rows="3" style="width:70%"></textarea></div>
  <div class="form-row" data-field="rerankProfile"><label for="node-input-rerankProfile" title="Reranking model profile used by the cross-encoder strategy.">rerank profile</label><input type="text" id="node-input-rerankProfile"></div>
  <div class="form-row" data-field="diversityBias"><label for="node-input-diversityBias" title="MMR diversity preference from 0 to 1.">diversity bias</label><input id="node-input-diversityBias" type="number" step="any"></div>
  <div class="form-row" data-field="limit"><label for="node-input-limit" title="Maximum evidence items retained.">limit</label><input id="node-input-limit" type="number" step="any"></div>
  <div class="form-row" data-field="cutoff"><label for="node-input-cutoff" title="Optional minimum reranking score.">cutoff</label><input id="node-input-cutoff" type="text"></div>
  <div class="form-row" data-field="field"><label for="node-input-field" title="Trusted numeric metadata field used for a rule boost.">field</label><input id="node-input-field" type="text"></div>
  <div class="form-row" data-field="boost"><label for="node-input-boost" title="Multiplier applied to the rule field.">boost</label><input id="node-input-boost" type="number" step="any"></div>
</script>

<script type="text/html" data-help-name="context-weave-rerank">
  <p>Applies one strategy or ordered strategy chain. Preserve prior scores.</p>
  <p><b>Input</b> query + evidence</p>
  <p><b>Output</b> reordered evidence</p>
</script>
