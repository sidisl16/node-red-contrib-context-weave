<script type="text/javascript">
RED.nodes.registerType("context-weave-retrieve", {
  "category": "context weave",
  "defaults": {
    "name": {
      "value": ""
    },
    "library": {
      "value": "",
      "type": "context-weave-library",
      "required": false
    },
    "libraries": {
      "value": []
    },
    "querySource": {
      "value": "contextWeave.query"
    },
    "querySourceType": {
      "value": "msg"
    },
    "mode": {
      "value": "hybrid"
    },
    "lexicalWeight": {
      "value": 0.05
    },
    "metadataFilter": {
      "value": ""
    },
    "candidateLimit": {
      "value": 25
    },
    "resultLimit": {
      "value": 10
    },
    "offset": {
      "value": 0
    },
    "contextMode": {
      "value": "sentences"
    },
    "sentencesBefore": {
      "value": 1
    },
    "sentencesAfter": {
      "value": 1
    },
    "charactersBefore": {
      "value": 100
    },
    "charactersAfter": {
      "value": 100
    },
    "highlights": {
      "value": false
    }
  },
  "color": "#b2d5cc",
  "inputs": 1,
  "outputs": 2,
  "outputLabels": [
    "success",
    "error"
  ],
  "icon": "font-awesome/fa-book",
  paletteLabel: function () { return "retrieve"; },
  label: function () { return this.name || "retrieve"; },
  oneditprepare: function () {
    $('#node-input-libraries').val(JSON.stringify(this.libraries ?? [], null, 2));
  },
  oneditsave: function () {
    this.libraries = JSON.parse($('#node-input-libraries').val()); $('#node-input-libraries').remove();
    this.lexicalWeight = Number($('#node-input-lexicalWeight').val()); $('#node-input-lexicalWeight').remove();
    this.candidateLimit = Number($('#node-input-candidateLimit').val()); $('#node-input-candidateLimit').remove();
    this.resultLimit = Number($('#node-input-resultLimit').val()); $('#node-input-resultLimit').remove();
    this.offset = Number($('#node-input-offset').val()); $('#node-input-offset').remove();
    this.sentencesBefore = Number($('#node-input-sentencesBefore').val()); $('#node-input-sentencesBefore').remove();
    this.sentencesAfter = Number($('#node-input-sentencesAfter').val()); $('#node-input-sentencesAfter').remove();
    this.charactersBefore = Number($('#node-input-charactersBefore').val()); $('#node-input-charactersBefore').remove();
    this.charactersAfter = Number($('#node-input-charactersAfter').val()); $('#node-input-charactersAfter').remove();
  }
});
</script>

<script type="text/html" data-template-name="context-weave-retrieve">
  <div class="form-row"><label for="node-input-name">name</label><input id="node-input-name" type="text"></div>
  <div class="form-row"><label for="node-input-library">library</label><input type="text" id="node-input-library"></div>
  <div class="form-row"><label for="node-input-libraries">libraries</label><textarea id="node-input-libraries" rows="3" style="width:70%"></textarea></div>
  <div class="form-row"><label for="node-input-querySource">query source</label><input id="node-input-querySource" type="text"></div>
  <div class="form-row"><label for="node-input-querySourceType">query source type</label><select id="node-input-querySourceType"><option value="msg">msg</option><option value="str">str</option><option value="flow">flow</option><option value="global">global</option><option value="env">env</option><option value="bool">bool</option><option value="num">num</option><option value="json">json</option></select></div>
  <div class="form-row"><label for="node-input-mode">mode</label><input id="node-input-mode" type="text"></div>
  <div class="form-row"><label for="node-input-lexicalWeight">lexical weight</label><input id="node-input-lexicalWeight" type="number" step="any"></div>
  <div class="form-row"><label for="node-input-metadataFilter">metadata filter</label><input id="node-input-metadataFilter" type="text"></div>
  <div class="form-row"><label for="node-input-candidateLimit">candidate limit</label><input id="node-input-candidateLimit" type="number" step="any"></div>
  <div class="form-row"><label for="node-input-resultLimit">result limit</label><input id="node-input-resultLimit" type="number" step="any"></div>
  <div class="form-row"><label for="node-input-offset">offset</label><input id="node-input-offset" type="number" step="any"></div>
  <div class="form-row"><label for="node-input-contextMode">context mode</label><input id="node-input-contextMode" type="text"></div>
  <div class="form-row"><label for="node-input-sentencesBefore">sentences before</label><input id="node-input-sentencesBefore" type="number" step="any"></div>
  <div class="form-row"><label for="node-input-sentencesAfter">sentences after</label><input id="node-input-sentencesAfter" type="number" step="any"></div>
  <div class="form-row"><label for="node-input-charactersBefore">characters before</label><input id="node-input-charactersBefore" type="number" step="any"></div>
  <div class="form-row"><label for="node-input-charactersAfter">characters after</label><input id="node-input-charactersAfter" type="number" step="any"></div>
  <div class="form-row"><label for="node-input-highlights">highlights</label><input id="node-input-highlights" type="checkbox"></div>
</script>

<script type="text/html" data-help-name="context-weave-retrieve">
  <p>Dense, lexical, or hybrid retrieval across one/many libraries. No LLM call.</p>
  <p><b>Input</b> `msg.contextWeave.query` (or configured property)</p>
  <p><b>Output</b> `msg.contextWeave.evidence`</p>
</script>
