<script type="text/javascript">
RED.nodes.registerType("context-weave-query-history", {
  "category": "context weave",
  "defaults": {
    "name": {
      "value": ""
    },
    "library": {
      "value": "",
      "type": "context-weave-library",
      "required": false
    },
    "pageSize": {
      "value": 50
    },
    "cursorSource": {
      "value": "contextWeave.cursor"
    },
    "cursorSourceType": {
      "value": "msg"
    }
  },
  "color": "#b2d5cc",
  "inputs": 1,
  "outputs": 2,
  "outputLabels": [
    "success",
    "error"
  ],
  "icon": "font-awesome/fa-book",
  paletteLabel: function () { return "query-history"; },
  label: function () { return this.name || "query-history"; },
  oneditprepare: function () {

  },
  oneditsave: function () {
    this.pageSize = Number($('#node-input-pageSize').val()); $('#node-input-pageSize').remove();
