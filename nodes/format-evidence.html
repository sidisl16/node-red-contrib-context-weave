<script type="text/javascript">
RED.nodes.registerType("context-weave-format-evidence", {
  "category": "context weave",
  "defaults": {
    "name": {
      "value": ""
    },
    "evidenceSource": {
      "value": "contextWeave.evidence"
    },
    "evidenceSourceType": {
      "value": "msg"
    },
    "format": {
      "value": "text"
    },
    "maxItemChars": {
      "value": 4000
    },
    "maxTotalChars": {
      "value": 24000
    }
  },
  "color": "#b2d5cc",
  "inputs": 1,
  "outputs": 2,
  "outputLabels": [
    "success",
    "error"
  ],
  "icon": "font-awesome/fa-book",
  paletteLabel: function () { return "format-evidence"; },
  label: function () { return this.name || "format-evidence"; },
  oneditprepare: function () {

  },
  oneditsave: function () {
    this.maxItemChars = Number($('#node-input-maxItemChars').val()); $('#node-input-maxItemChars').remove();
    this.maxTotalChars = Number($('#node-input-maxTotalChars').val()); $('#node-input-maxTotalChars').remove();
  }
});
</script>

<script type="text/html" data-template-name="context-weave-format-evidence">
  <div class="form-row"><label for="node-input-name">name</label><input id="node-input-name" type="text"></div>
  <div class="form-row"><label for="node-input-evidenceSource">evidence source</label><input id="node-input-evidenceSource" type="text"></div>
  <div class="form-row"><label for="node-input-evidenceSourceType">evidence source type</label><select id="node-input-evidenceSourceType"><option value="msg">msg</option><option value="str">str</option><option value="flow">flow</option><option value="global">global</option><option value="env">env</option><option value="bool">bool</option><option value="num">num</option><option value="json">json</option></select></div>
  <div class="form-row"><label for="node-input-format">format</label><input id="node-input-format" type="text"></div>
  <div class="form-row"><label for="node-input-maxItemChars">max item chars</label><input id="node-input-maxItemChars" type="number" step="any"></div>
  <div class="form-row"><label for="node-input-maxTotalChars">max total chars</label><input id="node-input-maxTotalChars" type="number" step="any"></div>
</script>

<script type="text/html" data-help-name="context-weave-format-evidence">
  <p>Stable citation tokens such as `[E:abc123]`; keep full evidence separately.</p>

</script>
