<script type="text/javascript">
RED.nodes.registerType("context-weave-format-evidence", {
  "category": "context weave",
  "defaults": {
    "name": {
      "value": ""
    },
    "evidenceSource": {
      "value": "contextWeave.evidence"
    },
    "evidenceSourceType": {
      "value": "msg"
    },
    "format": {
      "value": "text"
    },
    "maxItemChars": {
      "value": 4000
    },
    "maxTotalChars": {
      "value": 24000
    }
  },
  "color": "#5B8DEF",
  "inputs": 1,
  "outputs": 2,
  "outputLabels": [
    "success",
    "error"
  ],
  "icon": "font-awesome/fa-align-left",
  paletteLabel: function () { return "format-evidence"; },
  label: function () { return this.name || "format-evidence"; },
  oneditprepare: function () {

  },
  oneditsave: function () {
    this.maxItemChars = Number($('#node-input-maxItemChars').val()); $('#node-input-maxItemChars').remove();
    this.maxTotalChars = Number($('#node-input-maxTotalChars').val()); $('#node-input-maxTotalChars').remove();
  }
});
</script>

<script type="text/html" data-template-name="context-weave-format-evidence">
  <div class="form-row" data-field="name"><label for="node-input-name" title="Optional label shown on the flow.">name</label><input id="node-input-name" type="text"></div>
  <div class="form-row" data-field="evidenceSource"><label for="node-input-evidenceSource" title="Message path or typed value read at runtime.">evidence source</label><input id="node-input-evidenceSource" type="text"></div>
  <div class="form-row" data-field="evidenceSourceType"><label for="node-input-evidenceSourceType" title="Node-RED typed-input kind used to evaluate the adjacent source value.">evidence source type</label><select id="node-input-evidenceSourceType"><option value="msg">msg</option><option value="str">str</option><option value="flow">flow</option><option value="global">global</option><option value="env">env</option><option value="bool">bool</option><option value="num">num</option><option value="json">json</option></select></div>
  <div class="form-row" data-field="format"><label for="node-input-format" title="Output serialization format.">format</label><select id="node-input-format"><option value="text">text</option><option value="markdown">markdown</option><option value="json">json</option></select></div>
  <div class="form-row" data-field="maxItemChars"><label for="node-input-maxItemChars" title="Maximum characters copied from one evidence item.">max item chars</label><input id="node-input-maxItemChars" type="number" step="any"></div>
  <div class="form-row" data-field="maxTotalChars"><label for="node-input-maxTotalChars" title="Total formatted evidence character budget.">max total chars</label><input id="node-input-maxTotalChars" type="number" step="any"></div>
</script>

<script type="text/html" data-help-name="context-weave-format-evidence">
  <p>Stable citation tokens such as `[E:abc123]`; keep full evidence separately.</p>
  <p><b>Input</b> evidence</p>
  <p><b>Output</b> text/JSON/Markdown prompt block</p>
</script>
