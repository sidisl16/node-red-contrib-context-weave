<script type="text/javascript">
RED.nodes.registerType("context-weave-conversation-store", {
  "category": "config",
  "defaults": {
    "name": {
      "value": ""
    },
    "adapter": {
      "value": "sqlite"
    },
    "ttlSeconds": {
      "value": 86400
    },
    "maxTurns": {
      "value": 20
    },
    "maxChars": {
      "value": 24000
    }
  },
  paletteLabel: function () { return "conversation-store"; },
  label: function () { return this.name || "conversation-store"; },
  oneditprepare: function () {

  },
  oneditsave: function () {
    this.ttlSeconds = Number($('#node-config-input-ttlSeconds').val()); $('#node-config-input-ttlSeconds').remove();
    this.maxTurns = Number($('#node-config-input-maxTurns').val()); $('#node-config-input-maxTurns').remove();
    this.maxChars = Number($('#node-config-input-maxChars').val()); $('#node-config-input-maxChars').remove();
  }
});
</script>

<script type="text/html" data-template-name="context-weave-conversation-store">
  <div class="form-row" data-field="name"><label for="node-config-input-name" title="Optional label shown on the flow.">name</label><input id="node-config-input-name" type="text"></div>
  <div class="form-row" data-field="adapter"><label for="node-config-input-adapter" title="Backend or API protocol used by this connection.">adapter</label><select id="node-config-input-adapter"><option value="sqlite">sqlite</option><option value="memory">memory</option></select></div>
  <div class="form-row" data-field="ttlSeconds"><label for="node-config-input-ttlSeconds" title="Conversation lifetime after its latest activity.">ttl seconds</label><input id="node-config-input-ttlSeconds" type="number" step="any"></div>
  <div class="form-row" data-field="maxTurns"><label for="node-config-input-maxTurns" title="Maximum retained conversation messages.">max turns</label><input id="node-config-input-maxTurns" type="number" step="any"></div>
  <div class="form-row" data-field="maxChars"><label for="node-config-input-maxChars" title="Maximum total retained conversation characters.">max chars</label><input id="node-config-input-maxChars" type="number" step="any"></div>
</script>

<script type="text/html" data-help-name="context-weave-conversation-store">
  <p>Reusable conversation store configuration.</p>
  <p><b>Input</b> Selected by dependent nodes</p>
  <p><b>Output</b> Referenced configuration</p>
</script>
