<script type="text/javascript">
RED.nodes.registerType("context-weave-cite", {
  "category": "context weave",
  "defaults": {
    "name": {
      "value": ""
    },
    "answerSource": {
      "value": ""
    },
    "evidenceSource": {
      "value": "contextWeave.evidence"
    },
    "citationFormat": {
      "value": "structured-and-numeric"
    },
    "requireCitations": {
      "value": true
    },
    "minimumCitations": {
      "value": 1
    }
  },
  "color": "#b2d5cc",
  "inputs": 1,
  "outputs": 2,
  "outputLabels": [
    "success",
    "error"
  ],
  "icon": "font-awesome/fa-book",
  paletteLabel: function () { return "cite"; },
  label: function () { return this.name || "cite"; },
  oneditprepare: function () {

  },
  oneditsave: function () {
    this.minimumCitations = Number($('#node-input-minimumCitations').val()); $('#node-input-minimumCitations').remove();
  }
});
</script>

<script type="text/html" data-template-name="context-weave-cite">
  <div class="form-row"><label for="node-input-name">name</label><input id="node-input-name" type="text"></div>
  <div class="form-row"><label for="node-input-answerSource">answer source</label><input id="node-input-answerSource" type="text"></div>
  <div class="form-row"><label for="node-input-evidenceSource">evidence source</label><input id="node-input-evidenceSource" type="text"></div>
  <div class="form-row"><label for="node-input-citationFormat">citation format</label><input id="node-input-citationFormat" type="text"></div>
  <div class="form-row"><label for="node-input-requireCitations">require citations</label><input id="node-input-requireCitations" type="checkbox"></div>
  <div class="form-row"><label for="node-input-minimumCitations">minimum citations</label><input id="node-input-minimumCitations" type="number" step="any"></div>
</script>

<script type="text/html" data-help-name="context-weave-cite">
  <p>Validates/normalizes citations and can render `numeric`, `markdown`, or `html` forms.</p>
  <p><b>Input</b> answer with `[E:id]` markers + evidence</p>
  <p><b>Output</b> normalized citation list/rendering</p>
</script>
